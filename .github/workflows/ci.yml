name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks: unit tests (Electron mocked) and a dependency audit.
  unit:
    name: Unit tests + npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Fails when a published advisory affects Electron or another dependency — the signal to upgrade (docs/upgrading-electron.md)
      - run: npm audit --audit-level=high

  # The real app, driven by Playwright, on Linux under Xvfb.
  e2e-linux:
    name: E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # GitHub's Ubuntu images restrict unprivileged user namespaces, which Chromium's sandbox needs
      E2E_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: npm run test:e2e
      # the pictures of every screen (tests/e2e/20-screens.e2e.js): the before/after record of the redesign
      - name: Keep the screen pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screens-linux
          path: test-results/screens
          if-no-files-found: ignore
          retention-days: 30

  # The shipped configuration: build it as users get it and read the Electron fuses back from the binary
  # (the E2E builds differ in one fuse, because Playwright needs --inspect).
  packaged-fuses:
    name: Production build + Electron fuses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --dir --publish never
      - run: node scripts/check-fuses.js dist/linux-unpacked/mtc-browser

  # Windows is the real target platform, so these two jobs are required like the Linux ones.
  e2e-windows:
    name: E2E (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # run the E2E suite even when a unit test failed, so one run shows every Windows problem
      - run: npm run test:e2e
        if: ${{ !cancelled() }}
      - name: Keep the screen pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screens-windows
          path: test-results/screens
          if-no-files-found: ignore
          retention-days: 30

  # Same security/UI scenarios against an electron-builder --dir build (app.asar, app.isPackaged, real OS sandbox).
  e2e-windows-packaged:
    name: E2E (Windows, packaged build)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:packaged

  # The installer users get, built and tried on every change: silent install, browser registration with Windows
  # (build/installer.nsh), start from a link, uninstall. The release workflow repeats this before it publishes.
  installer-windows:
    name: Installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Install it silently, start it from a link, check it, uninstall
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/smoke-installer.js "dist/SHMMOTH-Browser-Setup-${VERSION}.exe"
