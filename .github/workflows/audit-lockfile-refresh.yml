name: Temporary audited lockfile refresh

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-lockfile-refresh.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  refresh:
    name: Generate lockfile with non-breaking audit fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit fixes
        run: npm audit fix --audit-level=high
        continue-on-error: true
      - name: Upload updated package lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
