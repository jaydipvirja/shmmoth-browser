<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks - SHMMOTH BROWSER</title>
  <link rel="stylesheet" href="settings.css">
  <style>
    .folder-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin: 12px 0;
    }
    .folder-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.15s;
    }
    .folder-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .folder-item.active {
      background: #3b82f6;
      color: #ffffff;
      font-weight: 600;
    }
    .folder-count {
      font-size: 11px;
      opacity: 0.75;
      background: rgba(0, 0, 0, 0.2);
      padding: 1px 6px;
      border-radius: 10px;
    }
    .delete-folder-btn {
      background: transparent;
      border: none;
      color: inherit;
      opacity: 0.6;
      cursor: pointer;
      font-size: 11px;
      padding: 2px 4px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .delete-folder-btn:hover {
      opacity: 1;
      color: #ef4444;
    }
    .bookmarks-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 16px 0;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-box input {
      width: 100%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 9px 14px 9px 36px;
      color: #ffffff;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: #3b82f6;
    }
    .search-box .icon {
      position: absolute;
      left: 12px;
      font-size: 14px;
      color: #94a3b8;
    }
    .bookmarks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }
    .bookmark-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 124px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .bookmark-card:hover {
      background: #334155;
      transform: translateY(-2px);
      border-color: rgba(59, 130, 246, 0.4);
    }
    .bm-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bm-icon {
      font-size: 18px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .bm-icon img {
      width: 16px;
      height: 16px;
      border-radius: 2px;
    }
    .bm-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #ffffff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .bm-url {
      font-size: 11.5px;
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin: 4px 0;
    }
    .bm-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      font-size: 11px;
    }
    .bm-folder-badge {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .bm-actions {
      display: flex;
      gap: 4px;
    }
    .bm-action-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 12px;
      transition: all 0.15s;
    }
    .bm-action-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
    }
    .bm-action-btn.delete:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }
    /* Modal styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 24px;
      width: 420px;
      max-width: 90vw;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #ffffff;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .form-group label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }
    .form-group input, .form-group select {
      background: #0f172a;
      border: 1px solid #334155;
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #3b82f6;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      cursor: pointer;
    }
    .btn-primary {
      background: #3b82f6;
      border: 1px solid #60a5fa;
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 12.5px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="settings-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-badge">
          <span class="brand-dot"></span>
          <span>SHMMOTH BROWSER</span>
        </div>
        <h2>Bookmarks</h2>
      </div>

      <div style="padding: 0 8px;">
        <button id="btn-new-folder" class="btn-secondary" style="width: 100%; margin-bottom: 8px;">+ New Folder</button>
      </div>

      <nav id="folder-list" class="folder-list">
        <!-- Folders rendered here -->
      </nav>

      <div class="sidebar-footer">
        <button id="btn-back" class="btn-return">← Back to Browsing</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="content-area">
      <div class="section-title">
        <h2 id="current-folder-title">All Bookmarks</h2>
        <p>Manage, organize, and edit your saved bookmarks.</p>
      </div>

      <!-- Toolbar -->
      <div class="bookmarks-toolbar">
        <div class="search-box">
          <span class="icon">🔍</span>
          <input type="text" id="bm-search-input" placeholder="Search bookmarks by title, URL or folder..." autocomplete="off">
        </div>
        <button id="btn-add-bookmark" class="btn-primary">+ Add Bookmark</button>
      </div>

      <div id="bookmarks-container" class="bookmarks-grid">
        <!-- Bookmark cards rendered here -->
      </div>
    </main>
  </div>

  <!-- Add/Edit Bookmark Modal -->
  <div id="bookmark-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 id="bm-modal-title" class="modal-title">Add Bookmark</h3>
      <input type="hidden" id="bm-modal-id">
      <div class="form-group">
        <label for="bm-modal-name">Title</label>
        <input type="text" id="bm-modal-name" placeholder="e.g. GitHub" required>
      </div>
      <div class="form-group">
        <label for="bm-modal-url">URL</label>
        <input type="text" id="bm-modal-url" placeholder="https://..." required>
      </div>
      <div class="form-group">
        <label for="bm-modal-folder">Folder</label>
        <select id="bm-modal-folder">
          <!-- Populated dynamically -->
        </select>
      </div>
      <div class="modal-actions">
        <button id="btn-cancel-bm-modal" class="btn-cancel">Cancel</button>
        <button id="btn-save-bm-modal" class="btn-primary">Save Bookmark</button>
      </div>
    </div>
  </div>

  <!-- Add Folder Modal -->
  <div id="folder-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 class="modal-title">Create New Folder</h3>
      <div class="form-group">
        <label for="folder-modal-name">Folder Name</label>
        <input type="text" id="folder-modal-name" placeholder="e.g. Development, Travel..." required>
      </div>
      <div class="modal-actions">
        <button id="btn-cancel-folder-modal" class="btn-cancel">Cancel</button>
        <button id="btn-save-folder-modal" class="btn-primary">Create Folder</button>
      </div>
    </div>
  </div>

  <script src="bookmarks.js"></script>
</body>
</html>
