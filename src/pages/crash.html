<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aw, Snap! - SHMMOTH BROWSER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }
    .crash-card {
      max-width: 540px;
      width: 100%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: left;
    }
    .crash-icon {
      font-size: 44px;
      margin-bottom: 16px;
      display: inline-block;
    }
    .crash-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }
    .crash-desc {
      font-size: 14.5px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .crash-error-code {
      display: inline-block;
      font-size: 12px;
      font-family: monospace;
      color: #64748b;
      background: #0f172a;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 24px;
    }
    .crash-actions {
      display: flex;
      gap: 12px;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #3b82f6;
    }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="crash-card">
    <div class="crash-icon">💥</div>
    <h1 class="crash-title">Aw, Snap!</h1>
    <p class="crash-desc">
      Something went wrong while displaying this webpage. To continue, reload or navigate to another page.
    </p>
    <div id="crash-code" class="crash-error-code">Error code: RESULT_CODE_CRASHED</div>
    <div class="crash-actions">
      <button id="btn-reload" class="btn-primary">Reload</button>
      <button id="btn-newtab" class="btn-secondary">New Tab</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const reason = urlParams.get('reason') || 'crashed';
    const targetUrl = urlParams.get('url') || '';
    const tabId = urlParams.get('tabId') || '';

    const codeEl = document.getElementById('crash-code');
    if (codeEl) {
      codeEl.textContent = `Error code: STATUS_${reason.toUpperCase().replace(/-/g, '_')}`;
    }

    document.getElementById('btn-reload').addEventListener('click', () => {
      if (window.mtcAPI && window.mtcAPI.reloadTab) {
        window.mtcAPI.reloadTab();
      } else if (targetUrl) {
        window.location.href = targetUrl;
      } else {
        window.location.reload();
      }
    });

    document.getElementById('btn-newtab').addEventListener('click', () => {
      if (window.mtcAPI && window.mtcAPI.createTab) {
        window.mtcAPI.createTab('mtc://newtab');
      } else {
        window.location.href = 'mtc://newtab';
      }
    });
  </script>
</body>
</html>
