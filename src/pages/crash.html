<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="design-tokens.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aw, Snap! - SHMMOTH BROWSER</title>
  <link rel="stylesheet" href="fonts.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--sh-bg);
      color: var(--sh-text);
      font-family: var(--sh-font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }
    .crash-card {
      max-width: 540px;
      width: 100%;
      background: var(--sh-surface);
      border: 1px solid var(--sh-border);
      border-radius: 16px;
      padding: 36px;
      box-shadow: var(--sh-shadow);
      text-align: left;
    }
    .crash-icon {
      width: 52px;
      height: 52px;
      margin-bottom: 18px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--sh-warning-bg);
      color: var(--sh-warning);
    }
    .crash-icon .sh-icon-svg { width: 26px; height: 26px; }
    .crash-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--sh-text);
      margin-bottom: 12px;
    }
    .crash-desc {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--sh-text-2);
      margin-bottom: 24px;
    }
    .crash-error-code {
      display: inline-block;
      font-size: 12px;
      font-family: monospace;
      color: var(--sh-text-2);
      background: var(--sh-field);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--sh-border);
      margin-bottom: 24px;
    }
    .crash-actions {
      display: flex;
      gap: 12px;
    }
    .btn-primary {
      background: var(--sh-accent);
      color: var(--sh-on-accent);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: var(--sh-accent-hover);
    }
    .btn-secondary {
      background: var(--sh-surface-2);
      color: var(--sh-text);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-secondary:hover {
      background: var(--sh-border-strong);
    }
  </style>
</head>
<body>
  <div class="crash-card">
    <div class="crash-icon"><span class="sh-icon" data-icon="warning" aria-hidden="true"></span></div>
    <h1 class="crash-title">Aw, Snap!</h1>
    <p class="crash-desc">
      Something went wrong while displaying this webpage. To continue, reload or navigate to another page.
    </p>
    <div id="crash-code" class="crash-error-code">Error code: RESULT_CODE_CRASHED</div>
    <div class="crash-actions">
      <button id="btn-reload" class="btn-primary">Reload</button>
      <button id="btn-newtab" class="btn-secondary">New Tab</button>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="icons.js"></script>
  <script src="crash.js"></script>
</body>
</html>
