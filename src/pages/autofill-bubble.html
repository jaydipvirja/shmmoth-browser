<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 'self': the shared design tokens, font, theme and icon scripts next to this page -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'">
  <title>Saved logins</title>
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { font-family: var(--sh-font); user-select: none; padding: 3px; }
    .box {
      height: 100%; display: flex; flex-direction: column;
      background: var(--sh-surface); border: 1px solid var(--sh-border-strong); border-radius: 10px;
      box-shadow: var(--sh-shadow); overflow: hidden; animation: sh-pop var(--sh-motion) ease-out;
    }
    .head { padding: 9px 12px 6px; }
    .title { font-size: 12.5px; font-weight: 600; color: var(--sh-text); }
    .origin { font-size: 11px; color: var(--sh-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list { flex: 1; overflow-y: auto; padding: 2px 4px 4px; }
    .row {
      display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 10px;
      background: transparent; border: none; border-radius: 6px; color: var(--sh-text); font: 400 13px var(--sh-font);
      text-align: left; cursor: pointer;
    }
    .row:hover, .row:focus-visible { background: var(--sh-hover); outline: none; }
    .icon { display: inline-flex; width: 15px; height: 15px; color: var(--sh-accent-text); }
    .icon svg { width: 100%; height: 100%; }
    .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg { padding: 10px 12px; font-size: 12px; color: var(--sh-text-2); }
  </style>
</head>
<body>
  <div class="box">
    <div class="head">
      <div class="title">Use a saved login</div>
      <div class="origin" id="origin"></div>
    </div>
    <div class="list" id="list"></div>
  </div>

  <script src="theme.js"></script>
  <script src="icons.js"></script>
  <script>
    const api = window.shmmothAPI || window.mtcAPI;
    const list = document.getElementById('list');
    let promptId = null;
    let busy = false;

    function render(chooser) {
      list.textContent = '';
      if (!chooser || !Array.isArray(chooser.accounts) || chooser.accounts.length === 0) {
        const m = document.createElement('div');
        m.className = 'msg';
        m.textContent = 'No saved logins.';
        list.appendChild(m);
        return;
      }
      promptId = chooser.promptId;
      document.getElementById('origin').textContent = chooser.origin || '';
      chooser.accounts.forEach((account) => {
        const row = document.createElement('button');
        row.className = 'row';
        row.type = 'button';
        row.dataset.id = account.id;
        row.title = account.username;
        const icon = document.createElement('span');
        icon.className = 'icon';
        const key = window.ShIcons && window.ShIcons.create('key');
        if (key) icon.appendChild(key);
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = account.username;
        row.append(icon, name);
        row.addEventListener('click', () => choose(account.id));
        list.appendChild(row);
      });
    }

    async function choose(id) {
      if (busy || !api) return;
      busy = true;
      try { await api.choosePasswordAutofill(promptId, id); } catch (_) { /* the window closes itself */ }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && api) api.dismissPasswordAutofill();
    });

    if (api && typeof api.getPasswordAutofillChooser === 'function') {
      api.getPasswordAutofillChooser().then(render).catch(() => render(null));
    }
  </script>
</body>
</html>
