<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Saved logins</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none; padding: 3px;
    }
    .box {
      height: 100%; display: flex; flex-direction: column;
      background: #1e293b; border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); overflow: hidden;
    }
    .head { padding: 9px 12px 6px; }
    .title { font-size: 12.5px; font-weight: 600; color: #f1f5f9; }
    .origin { font-size: 11px; color: #38bdf8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list { flex: 1; overflow-y: auto; padding: 2px 4px 4px; }
    .row {
      display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 10px;
      background: transparent; border: none; border-radius: 6px; color: #e2e8f0; font-size: 13px; text-align: left; cursor: pointer;
    }
    .row:hover, .row:focus-visible { background: rgba(56, 189, 248, 0.16); color: #fff; outline: none; }
    .icon { font-size: 15px; }
    .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg { padding: 10px 12px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="box">
    <div class="head">
      <div class="title">Use a saved login</div>
      <div class="origin" id="origin"></div>
    </div>
    <div class="list" id="list"></div>
  </div>

  <script>
    const api = window.shmmothAPI || window.mtcAPI;
    const list = document.getElementById('list');
    let promptId = null;
    let busy = false;

    function render(chooser) {
      list.textContent = '';
      if (!chooser || !Array.isArray(chooser.accounts) || chooser.accounts.length === 0) {
        const m = document.createElement('div');
        m.className = 'msg';
        m.textContent = 'No saved logins.';
        list.appendChild(m);
        return;
      }
      promptId = chooser.promptId;
      document.getElementById('origin').textContent = chooser.origin || '';
      chooser.accounts.forEach((account) => {
        const row = document.createElement('button');
        row.className = 'row';
        row.type = 'button';
        row.dataset.id = account.id;
        row.title = account.username;
        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = '🔑';
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = account.username;
        row.append(icon, name);
        row.addEventListener('click', () => choose(account.id));
        list.appendChild(row);
      });
    }

    async function choose(id) {
      if (busy || !api) return;
      busy = true;
      try { await api.choosePasswordAutofill(promptId, id); } catch (_) { /* the window closes itself */ }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && api) api.dismissPasswordAutofill();
    });

    if (api && typeof api.getPasswordAutofillChooser === 'function') {
      api.getPasswordAutofillChooser().then(render).catch(() => render(null));
    }
  </script>
</body>
</html>
