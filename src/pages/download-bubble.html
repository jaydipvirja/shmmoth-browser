<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="fonts.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloads</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: var(--sh-font);
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    .bubble-container {
      animation: sh-pop var(--sh-motion) ease-out;
      width: 100%;
      height: 100%;
      background: var(--sh-surface);
      border: 1px solid var(--sh-border-strong);
      border-radius: 12px;
      box-shadow: var(--sh-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .bubble-header {
      height: 46px;
      background: var(--sh-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid var(--sh-border);
      flex-shrink: 0;
    }

    .bubble-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--sh-text);
    }

    .bubble-title-icon {
      font-size: 14px;
      color: var(--sh-accent-text);
    }

    .bubble-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-header {
      background: transparent;
      border: none;
      color: var(--sh-text-2);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s, color 0.15s;
    }

    .btn-header:hover {
      background: var(--sh-hover);
      color: var(--sh-text);
    }

    /* List Area */
    .bubble-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bubble-body::-webkit-scrollbar {
      width: 6px;
    }

    .bubble-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .bubble-body::-webkit-scrollbar-thumb {
      background: var(--sh-surface-2);
      border-radius: 3px;
    }

    .bubble-body::-webkit-scrollbar-thumb:hover {
      background: var(--sh-border-strong);
    }

    /* Empty state */
    .bubble-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--sh-text-2);
      font-size: 13px;
      gap: 8px;
      padding: 40px 0;
    }

    .bubble-empty-icon {
      font-size: 32px;
      opacity: 0.5;
    }

    /* Download Item Card */
    .download-card {
      background: var(--sh-hover);
      border: 1px solid var(--sh-border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s, border-color 0.15s;
    }

    .download-card:hover {
      background: var(--sh-hover);
      border-color: var(--sh-border);
    }

    .card-icon {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--sh-surface-2);
      color: var(--sh-text-2);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-filename {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--sh-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-progress-bg {
      height: 4px;
      background: var(--sh-hover);
      border-radius: 2px;
      overflow: hidden;
    }

    .card-progress-bar {
      height: 100%;
      background: var(--sh-accent);
      border-radius: 2px;
      width: 0%;
      transition: width 0.2s ease;
    }

    .card-progress-bar.completed   { background: var(--sh-success); }
    .card-progress-bar.paused      { background: var(--sh-warning); }
    .card-progress-bar.cancelled   { background: var(--sh-track); }
    .card-progress-bar.interrupted { background: var(--sh-danger-bg); }

    .card-meta {
      font-size: 11px;
      color: var(--sh-text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-card-action {
      background: var(--sh-hover);
      border: 1px solid var(--sh-border);
      color: var(--sh-text);
      font-size: 11.5px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .btn-card-action:hover {
      background: var(--sh-accent);
      border-color: var(--sh-accent);
      color: var(--sh-on-accent);
      font-weight: 600;
    }

    .btn-card-action.icon-only {
      width: 28px;
      height: 28px;
      padding: 0;
      font-size: 12px;
    }

    .btn-card-action.danger:hover {
      background: var(--sh-danger-bg);
      border-color: var(--sh-danger);
      color: var(--sh-on-accent);
    }

    /* Footer */
    .bubble-footer {
      height: 40px;
      background: var(--sh-surface-2);
      border-top: 1px solid var(--sh-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      flex-shrink: 0;
    }

    .btn-footer-link {
      background: transparent;
      border: none;
      color: var(--sh-accent-text);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      transition: color 0.15s, text-decoration 0.15s;
    }

    .btn-footer-link:hover {
      color: var(--sh-accent-text);
      text-decoration: underline;
    }

    .btn-footer-link.secondary {
      color: var(--sh-text-2);
    }

    .btn-footer-link.secondary:hover {
      color: var(--sh-text-2);
    }
  </style>
</head>
<body>
  <div class="bubble-container">
    <!-- Header -->
    <div class="bubble-header">
      <div class="bubble-title">
        <span class="bubble-title-icon"><span class="sh-icon" data-icon="download" aria-hidden="true"></span></span>
        <span>Downloads</span>
      </div>
      <div class="bubble-header-actions">
        <button id="btn-open-folder" class="btn-header" title="Open Downloads Folder" aria-label="Open Downloads Folder"><span class="sh-icon" data-icon="folder" aria-hidden="true"></span></button>
        <button id="btn-close-bubble" class="btn-header" title="Close" aria-label="Close"><span class="sh-icon" data-icon="close" aria-hidden="true"></span></button>
      </div>
    </div>

    <!-- Body / List -->
    <div id="bubble-list" class="bubble-body">
      <!-- Dynamically filled -->
    </div>

    <!-- Footer -->
    <div class="bubble-footer">
      <button id="btn-all-downloads" class="btn-footer-link">Show all downloads</button>
      <button id="btn-clear-completed" class="btn-footer-link secondary">Clear finished</button>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="theme.js"></script>
  <script>
    const api = window.mtcAPI || window.shmmothAPI;
    const bubbleList = document.getElementById('bubble-list');
    const btnOpenFolder = document.getElementById('btn-open-folder');
    const btnCloseBubble = document.getElementById('btn-close-bubble');
    const btnAllDownloads = document.getElementById('btn-all-downloads');
    const btnClearCompleted = document.getElementById('btn-clear-completed');

    let downloadsMap = new Map();

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
    }

    function formatSpeed(bytesPerSec) {
      if (!bytesPerSec || bytesPerSec <= 0) return '';
      return formatBytes(bytesPerSec) + '/s';
    }

    function formatETA(seconds) {
      if (!seconds || seconds <= 0 || !isFinite(seconds)) return '';
      if (seconds < 60) return `${Math.round(seconds)}s left`;
      const mins = Math.floor(seconds / 60);
      const secs = Math.round(seconds % 60);
      if (mins < 60) return `${mins}m ${secs}s left`;
      const hrs = Math.floor(mins / 60);
      return `${hrs}h ${mins % 60}m left`;
    }

    // the file type as a short label (ZIP, PDF …), escaped by the caller like everything from a download
    function getFileIcon(filename) {
      const ext = String(filename || '').includes('.') ? String(filename).split('.').pop().slice(0, 4).toUpperCase() : '';
      return ext || 'FILE';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getPercent(d) {
      if (!d.total || d.total <= 0) return 0;
      return Math.min(100, Math.round((d.received / d.total) * 100));
    }

    function render() {
      if (!bubbleList) return;
      bubbleList.innerHTML = '';

      const list = Array.from(downloadsMap.values()).sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));

      if (list.length === 0) {
        bubbleList.innerHTML = `
          <div class="bubble-empty">
            <span class="bubble-empty-icon"><span class="sh-icon" data-icon="download" aria-hidden="true"></span></span>
            <span>No recent downloads</span>
          </div>
        `;
        return;
      }

      list.slice(0, 15).forEach(d => {
        const card = document.createElement('div');
        card.className = 'download-card';

        const icon = getFileIcon(d.filename);
        const pct = getPercent(d);

        let progressClass = '';
        let metaText = '';

        if (d.state === 'completed') {
          progressClass = 'completed';
          metaText = `${formatBytes(d.total || d.received)} • Complete`;
        } else if (d.state === 'cancelled') {
          progressClass = 'cancelled';
          metaText = 'Cancelled';
        } else if (d.state === 'interrupted') {
          progressClass = 'interrupted';
          metaText = d.error ? `Failed • ${d.error}` : 'Interrupted';
        } else if (d.isPaused) {
          progressClass = 'paused';
          metaText = `${formatBytes(d.received)} / ${formatBytes(d.total)} • Paused`;
        } else {
          const speedStr = formatSpeed(d.speed);
          const etaStr = formatETA(d.eta);
          const parts = [
            `${formatBytes(d.received)} / ${formatBytes(d.total || 0)}`,
            speedStr,
            etaStr
          ].filter(Boolean);
          metaText = parts.join(' • ');
        }

        let buttonsHtml = '';
        if (d.state === 'progressing') {
          if (d.isPaused) {
            buttonsHtml = `
              <button class="btn-card-action icon-only btn-resume" data-id="${escapeHtml(d.id)}" title="Resume" aria-label="Resume"><span class="sh-icon" data-icon="play" aria-hidden="true"></span></button>
              <button class="btn-card-action icon-only danger btn-cancel" data-id="${escapeHtml(d.id)}" title="Cancel" aria-label="Cancel"><span class="sh-icon" data-icon="close" aria-hidden="true"></span></button>
            `;
          } else {
            buttonsHtml = `
              <button class="btn-card-action icon-only btn-pause" data-id="${escapeHtml(d.id)}" title="Pause" aria-label="Pause"><span class="sh-icon" data-icon="pause" aria-hidden="true"></span></button>
              <button class="btn-card-action icon-only danger btn-cancel" data-id="${escapeHtml(d.id)}" title="Cancel" aria-label="Cancel"><span class="sh-icon" data-icon="close" aria-hidden="true"></span></button>
            `;
          }
        } else if (d.state === 'completed') {
          buttonsHtml = `
            <button class="btn-card-action btn-open" data-id="${escapeHtml(d.id)}">Open</button>
            <button class="btn-card-action icon-only btn-folder" data-id="${escapeHtml(d.id)}" title="Show in folder" aria-label="Show in folder"><span class="sh-icon" data-icon="folder" aria-hidden="true"></span></button>
          `;
        } else if (d.state === 'interrupted' && d.resumable) {
          buttonsHtml = `
            <button class="btn-card-action icon-only btn-resume" data-id="${escapeHtml(d.id)}" title="Resume where it stopped" aria-label="Resume where it stopped"><span class="sh-icon" data-icon="play" aria-hidden="true"></span></button>
            <button class="btn-card-action icon-only btn-retry" data-url="${escapeHtml(d.url)}" title="Start over" aria-label="Start over"><span class="sh-icon" data-icon="reload" aria-hidden="true"></span></button>
          `;
        } else if (d.state === 'cancelled' || d.state === 'interrupted') {
          buttonsHtml = `
            <button class="btn-card-action icon-only btn-retry" data-url="${escapeHtml(d.url)}" title="Retry download" aria-label="Retry download"><span class="sh-icon" data-icon="reload" aria-hidden="true"></span></button>
          `;
        }

        card.innerHTML = `
          <div class="card-icon">${escapeHtml(icon)}</div>
          <div class="card-content">
            <div class="card-filename" title="${escapeHtml(d.turboNote ? d.filename + ' — ' + d.turboNote : d.filename)}">${escapeHtml(d.filename)}</div>
            <div class="card-progress-bg">
              <div class="card-progress-bar ${progressClass}" style="width: ${pct}%;"></div>
            </div>
            <div class="card-meta" title="${escapeHtml(metaText)}">${escapeHtml(metaText)}</div>
          </div>
          <div class="card-actions">
            ${buttonsHtml}
          </div>
        `;

        bubbleList.appendChild(card);
      });
      if (window.ShIcons) window.ShIcons.drawAll(bubbleList);
    }

    // Load initial downloads
    async function init() {
      if (api && api.getDownloads) {
        try {
          const list = await api.getDownloads();
          if (Array.isArray(list)) {
            list.forEach(d => {
              if (d && d.id) downloadsMap.set(d.id, d);
            });
            render();
          }
        } catch (_) {}
      }

      if (api && api.onDownloadUpdate) {
        api.onDownloadUpdate(record => {
          if (!record || !record.id) return;
          downloadsMap.set(record.id, record);
          render();
        });
      }
    }

    // Actions delegation
    bubbleList.addEventListener('click', async (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const id = btn.dataset.id;
      const url = btn.dataset.url;

      if (btn.classList.contains('btn-pause') && id && api.pauseDownload) {
        await api.pauseDownload(id);
      } else if (btn.classList.contains('btn-resume') && id && api.resumeDownload) {
        await api.resumeDownload(id);
      } else if (btn.classList.contains('btn-cancel') && id && api.cancelDownload) {
        await api.cancelDownload(id);
      } else if (btn.classList.contains('btn-open') && id && api.openDownloadedFile) {
        await api.openDownloadedFile(id);
      } else if (btn.classList.contains('btn-folder') && id && api.showDownloadInFolder) {
        await api.showDownloadInFolder(id);
      } else if (btn.classList.contains('btn-retry') && url && api.retryDownload) {
        await api.retryDownload(url);
      }
    });

    if (btnOpenFolder) {
      btnOpenFolder.addEventListener('click', () => {
        if (api && api.openDownloadsFolder) api.openDownloadsFolder();
      });
    }

    if (btnCloseBubble) {
      btnCloseBubble.addEventListener('click', () => {
        if (api && api.closeDownloadBubble) api.closeDownloadBubble();
      });
    }

    if (btnAllDownloads) {
      btnAllDownloads.addEventListener('click', () => {
        if (api && api.createTab) api.createTab('mtc://downloads');
        if (api && api.closeDownloadBubble) api.closeDownloadBubble();
      });
    }

    if (btnClearCompleted) {
      btnClearCompleted.addEventListener('click', async () => {
        if (api && api.clearDownloads) {
          await api.clearDownloads();
          for (const [k, v] of downloadsMap.entries()) {
            if (v.state === 'completed' || v.state === 'cancelled') {
              downloadsMap.delete(k);
            }
          }
          render();
        }
      });
    }

    // Close on Escape
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (api && api.closeDownloadBubble) api.closeDownloadBubble();
      }
    });

    init();
  </script>
</body>
</html>
