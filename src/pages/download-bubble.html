<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloads</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    .bubble-container {
      width: 100%;
      height: 100%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .bubble-header {
      height: 46px;
      background: #182234;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .bubble-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: #f8fafc;
    }

    .bubble-title-icon {
      font-size: 14px;
      color: #38bdf8;
    }

    .bubble-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-header {
      background: transparent;
      border: none;
      color: #94a3b8;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s, color 0.15s;
    }

    .btn-header:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    /* List Area */
    .bubble-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bubble-body::-webkit-scrollbar {
      width: 6px;
    }

    .bubble-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .bubble-body::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    .bubble-body::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Empty state */
    .bubble-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 13px;
      gap: 8px;
      padding: 40px 0;
    }

    .bubble-empty-icon {
      font-size: 32px;
      opacity: 0.5;
    }

    /* Download Item Card */
    .download-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s, border-color 0.15s;
    }

    .download-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .card-icon {
      font-size: 24px;
      flex-shrink: 0;
      width: 28px;
      text-align: center;
    }

    .card-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-filename {
      font-size: 12.5px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-progress-bg {
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .card-progress-bar {
      height: 100%;
      background: #38bdf8;
      border-radius: 2px;
      width: 0%;
      transition: width 0.2s ease;
    }

    .card-progress-bar.completed   { background: #10b981; }
    .card-progress-bar.paused      { background: #f59e0b; }
    .card-progress-bar.cancelled   { background: #64748b; }
    .card-progress-bar.interrupted { background: #ef4444; }

    .card-meta {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-card-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      font-size: 11.5px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .btn-card-action:hover {
      background: #38bdf8;
      border-color: #38bdf8;
      color: #0f172a;
      font-weight: 600;
    }

    .btn-card-action.icon-only {
      width: 28px;
      height: 28px;
      padding: 0;
      font-size: 12px;
    }

    .btn-card-action.danger:hover {
      background: #ef4444;
      border-color: #ef4444;
      color: #ffffff;
    }

    /* Footer */
    .bubble-footer {
      height: 40px;
      background: #141c2b;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      flex-shrink: 0;
    }

    .btn-footer-link {
      background: transparent;
      border: none;
      color: #38bdf8;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      transition: color 0.15s, text-decoration 0.15s;
    }

    .btn-footer-link:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }

    .btn-footer-link.secondary {
      color: #94a3b8;
    }

    .btn-footer-link.secondary:hover {
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="bubble-container">
    <!-- Header -->
    <div class="bubble-header">
      <div class="bubble-title">
        <span class="bubble-title-icon">⬇️</span>
        <span>Downloads</span>
      </div>
      <div class="bubble-header-actions">
        <button id="btn-open-folder" class="btn-header" title="Open Downloads Folder">📁</button>
        <button id="btn-close-bubble" class="btn-header" title="Close">✕</button>
      </div>
    </div>

    <!-- Body / List -->
    <div id="bubble-list" class="bubble-body">
      <!-- Dynamically filled -->
    </div>

    <!-- Footer -->
    <div class="bubble-footer">
      <button id="btn-all-downloads" class="btn-footer-link">Show all downloads</button>
      <button id="btn-clear-completed" class="btn-footer-link secondary">Clear finished</button>
    </div>
  </div>

  <script>
    const api = window.mtcAPI || window.shmmothAPI;
    const bubbleList = document.getElementById('bubble-list');
    const btnOpenFolder = document.getElementById('btn-open-folder');
    const btnCloseBubble = document.getElementById('btn-close-bubble');
    const btnAllDownloads = document.getElementById('btn-all-downloads');
    const btnClearCompleted = document.getElementById('btn-clear-completed');

    let downloadsMap = new Map();

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
    }

    function formatSpeed(bytesPerSec) {
      if (!bytesPerSec || bytesPerSec <= 0) return '';
      return formatBytes(bytesPerSec) + '/s';
    }

    function formatETA(seconds) {
      if (!seconds || seconds <= 0 || !isFinite(seconds)) return '';
      if (seconds < 60) return `${Math.round(seconds)}s left`;
      const mins = Math.floor(seconds / 60);
      const secs = Math.round(seconds % 60);
      if (mins < 60) return `${mins}m ${secs}s left`;
      const hrs = Math.floor(mins / 60);
      return `${hrs}h ${mins % 60}m left`;
    }

    function getFileIcon(filename) {
      if (!filename) return '📁';
      const ext = filename.split('.').pop().toLowerCase();
      switch (ext) {
        case 'mkv':
        case 'mp4':
        case 'avi':
        case 'mov':
        case 'webm':
        case 'm4v': return '🎬';
        case 'mp3':
        case 'wav':
        case 'flac':
        case 'aac': return '🎵';
        case 'zip':
        case 'rar':
        case '7z':
        case 'tar':
        case 'gz': return '📦';
        case 'pdf': return '📕';
        case 'exe':
        case 'msi':
        case 'apk':
        case 'dmg': return '⚙️';
        case 'png':
        case 'jpg':
        case 'jpeg':
        case 'gif':
        case 'webp': return '🖼️';
        case 'txt':
        case 'doc':
        case 'docx': return '📄';
        default: return '📁';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getPercent(d) {
      if (!d.total || d.total <= 0) return 0;
      return Math.min(100, Math.round((d.received / d.total) * 100));
    }

    function render() {
      if (!bubbleList) return;
      bubbleList.innerHTML = '';

      const list = Array.from(downloadsMap.values()).sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));

      if (list.length === 0) {
        bubbleList.innerHTML = `
          <div class="bubble-empty">
            <span class="bubble-empty-icon">⬇️</span>
            <span>No recent downloads</span>
          </div>
        `;
        return;
      }

      list.slice(0, 15).forEach(d => {
        const card = document.createElement('div');
        card.className = 'download-card';

        const icon = getFileIcon(d.filename);
        const pct = getPercent(d);

        let progressClass = '';
        let metaText = '';

        if (d.state === 'completed') {
          progressClass = 'completed';
          metaText = `${formatBytes(d.total || d.received)} • Complete`;
        } else if (d.state === 'cancelled') {
          progressClass = 'cancelled';
          metaText = 'Cancelled';
        } else if (d.state === 'interrupted') {
          progressClass = 'interrupted';
          metaText = 'Interrupted';
        } else if (d.isPaused) {
          progressClass = 'paused';
          metaText = `${formatBytes(d.received)} / ${formatBytes(d.total)} • Paused`;
        } else {
          const speedStr = formatSpeed(d.speed);
          const etaStr = formatETA(d.eta);
          const parts = [
            `${formatBytes(d.received)} / ${formatBytes(d.total || 0)}`,
            speedStr,
            etaStr
          ].filter(Boolean);
          metaText = parts.join(' • ');
        }

        let buttonsHtml = '';
        if (d.state === 'progressing') {
          if (d.isPaused) {
            buttonsHtml = `
              <button class="btn-card-action icon-only btn-resume" data-id="${escapeHtml(d.id)}" title="Resume">▶️</button>
              <button class="btn-card-action icon-only danger btn-cancel" data-id="${escapeHtml(d.id)}" title="Cancel">✕</button>
            `;
          } else {
            buttonsHtml = `
              <button class="btn-card-action icon-only btn-pause" data-id="${escapeHtml(d.id)}" title="Pause">⏸️</button>
              <button class="btn-card-action icon-only danger btn-cancel" data-id="${escapeHtml(d.id)}" title="Cancel">✕</button>
            `;
          }
        } else if (d.state === 'completed') {
          buttonsHtml = `
            <button class="btn-card-action btn-open" data-id="${escapeHtml(d.id)}">Open</button>
            <button class="btn-card-action icon-only btn-folder" data-id="${escapeHtml(d.id)}" title="Show in folder">📁</button>
          `;
        } else if (d.state === 'cancelled' || d.state === 'interrupted') {
          buttonsHtml = `
            <button class="btn-card-action icon-only btn-retry" data-url="${escapeHtml(d.url)}" title="Retry download">🔄</button>
          `;
        }

        card.innerHTML = `
          <div class="card-icon">${icon}</div>
          <div class="card-content">
            <div class="card-filename" title="${escapeHtml(d.filename)}">${escapeHtml(d.filename)}</div>
            <div class="card-progress-bg">
              <div class="card-progress-bar ${progressClass}" style="width: ${pct}%;"></div>
            </div>
            <div class="card-meta">${escapeHtml(metaText)}</div>
          </div>
          <div class="card-actions">
            ${buttonsHtml}
          </div>
        `;

        bubbleList.appendChild(card);
      });
    }

    // Load initial downloads
    async function init() {
      if (api && api.getDownloads) {
        try {
          const list = await api.getDownloads();
          if (Array.isArray(list)) {
            list.forEach(d => {
              if (d && d.id) downloadsMap.set(d.id, d);
            });
            render();
          }
        } catch (_) {}
      }

      if (api && api.onDownloadUpdate) {
        api.onDownloadUpdate(record => {
          if (!record || !record.id) return;
          downloadsMap.set(record.id, record);
          render();
        });
      }
    }

    // Actions delegation
    bubbleList.addEventListener('click', async (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const id = btn.dataset.id;
      const url = btn.dataset.url;

      if (btn.classList.contains('btn-pause') && id && api.pauseDownload) {
        await api.pauseDownload(id);
      } else if (btn.classList.contains('btn-resume') && id && api.resumeDownload) {
        await api.resumeDownload(id);
      } else if (btn.classList.contains('btn-cancel') && id && api.cancelDownload) {
        await api.cancelDownload(id);
      } else if (btn.classList.contains('btn-open') && id && api.openDownloadedFile) {
        await api.openDownloadedFile(id);
      } else if (btn.classList.contains('btn-folder') && id && api.showDownloadInFolder) {
        await api.showDownloadInFolder(id);
      } else if (btn.classList.contains('btn-retry') && url && api.retryDownload) {
        await api.retryDownload(url);
      }
    });

    if (btnOpenFolder) {
      btnOpenFolder.addEventListener('click', () => {
        if (api && api.openDownloadsFolder) api.openDownloadsFolder();
      });
    }

    if (btnCloseBubble) {
      btnCloseBubble.addEventListener('click', () => {
        if (api && api.closeDownloadBubble) api.closeDownloadBubble();
      });
    }

    if (btnAllDownloads) {
      btnAllDownloads.addEventListener('click', () => {
        if (api && api.createTab) api.createTab('mtc://downloads');
        if (api && api.closeDownloadBubble) api.closeDownloadBubble();
      });
    }

    if (btnClearCompleted) {
      btnClearCompleted.addEventListener('click', async () => {
        if (api && api.clearDownloads) {
          await api.clearDownloads();
          for (const [k, v] of downloadsMap.entries()) {
            if (v.state === 'completed' || v.state === 'cancelled') {
              downloadsMap.delete(k);
            }
          }
          render();
        }
      });
    }

    // Close on Escape
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (api && api.closeDownloadBubble) api.closeDownloadBubble();
      }
    });

    init();
  </script>
</body>
</html>
