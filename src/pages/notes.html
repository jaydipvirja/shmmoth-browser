<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="fonts.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Notes - SHMMOTH BROWSER</title>
  <link rel="stylesheet" href="settings.css">
  <style>
    body {
      background: var(--sh-surface);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }
    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--sh-border);
    }
    .notes-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--sh-text);
    }
    .notes-title .sh-icon { color: var(--sh-accent-text); width: 17px; height: 17px; }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .action-btn {
      background: var(--sh-hover);
      border: 1px solid var(--sh-border);
      color: var(--sh-text-2);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .action-btn:hover {
      background: var(--sh-hover);
      color: var(--sh-text);
    }
    .action-btn.danger:hover {
      background: var(--sh-danger-bg);
      border-color: var(--sh-danger);
      color: var(--sh-on-accent);
    }
    .notes-body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    textarea {
      flex: 1;
      width: 100%;
      background: var(--sh-field);
      border: 1px solid var(--sh-border);
      border-radius: 8px;
      padding: 14px;
      color: var(--sh-text);
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.6;
      resize: none;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: var(--sh-accent);
      box-shadow: 0 0 0 3px var(--sh-selected);
    }
    .notes-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 12px;
      color: var(--sh-text-2);
    }
    .save-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--sh-success);
    }
    .save-status.saving { color: var(--sh-warning); }
    .save-status .sh-icon { width: 13px; height: 13px; }
    .save-status.saving .sh-icon { visibility: hidden; }
  </style>
</head>
<body>
  <div class="notes-header">
    <div class="notes-title">
      <span class="sh-icon" data-icon="notes" aria-hidden="true"></span>
      <span>Quick Scratchpad</span>
    </div>
    <div class="header-actions">
      <button id="btn-copy" class="action-btn" title="Copy all notes">Copy All</button>
      <button id="btn-clear" class="action-btn danger" title="Clear notes">Clear</button>
    </div>
  </div>

  <div class="notes-body">
    <textarea id="notes-content" placeholder="Type or paste any notes, links, code, or ideas here... They will be saved automatically as you type!"></textarea>
  </div>

  <div class="notes-footer">
    <span id="stats">0 words | 0 chars</span>
    <span id="status" class="save-status"><span class="sh-icon" data-icon="check" aria-hidden="true"></span><span id="status-text">All changes saved</span></span>
  </div>

  <script src="theme.js"></script>
  <script src="icons.js"></script>
  <script src="notes.js"></script>
</body>
</html>
