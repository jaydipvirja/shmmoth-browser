<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="design-tokens.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Password?</title>
  <link rel="stylesheet" href="fonts.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: var(--sh-font);
      user-select: none;
      display: flex;
      flex-direction: column;
      padding: 4px;
    }

    .bubble-container {
      width: 100%;
      height: 100%;
      background: var(--sh-surface);
      border: 1px solid var(--sh-border-strong);
      border-radius: 12px;
      box-shadow: var(--sh-shadow);
      display: flex;
      flex-direction: column;
      padding: 14px 16px;
      gap: 12px;
      animation: sh-pop var(--sh-motion) ease-out;
    }

    .bubble-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bubble-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      background: var(--sh-selected);
      color: var(--sh-accent-text);
    }

    .bubble-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .bubble-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--sh-text);
    }

    .bubble-origin {
      font-size: 12px;
      color: var(--sh-text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bubble-close-btn {
      background: transparent;
      border: none;
      color: var(--sh-text-2);
      font-size: 15px;
      cursor: pointer;
      padding: 5px;
      border-radius: 6px;
      display: inline-flex;
    }

    .bubble-close-btn:hover {
      color: var(--sh-text);
      background: var(--sh-hover);
    }

    .bubble-details {
      background: var(--sh-surface-2);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bubble-field {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
    }

    .bubble-field-label {
      color: var(--sh-text-2);
    }

    .bubble-field-value {
      color: var(--sh-text);
      font-weight: 500;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bubble-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .btn-secondary {
      background: var(--sh-surface-2);
      color: var(--sh-text);
      border: 1px solid var(--sh-border);
      border-radius: 6px;
      padding: 6px 12px;
      font: 500 12px var(--sh-font);
      cursor: pointer;
      transition: background var(--sh-motion-fast) ease;
    }

    .btn-secondary:hover {
      background: var(--sh-hover);
    }

    .btn-primary {
      background: var(--sh-accent);
      color: var(--sh-on-accent);
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font: 600 12px var(--sh-font);
      cursor: pointer;
      transition: background var(--sh-motion-fast) ease;
    }

    .btn-primary:hover {
      background: var(--sh-accent-hover);
    }
  </style>
</head>
<body>
  <div class="bubble-container">
    <div class="bubble-header">
      <span class="bubble-icon"><span class="sh-icon" data-icon="key" aria-hidden="true"></span></span>
      <div class="bubble-info">
        <strong class="bubble-title">Save Password?</strong>
        <span id="prompt-origin" class="bubble-origin">example.com</span>
      </div>
      <button id="btn-close" class="bubble-close-btn" title="Dismiss" aria-label="Dismiss"><span class="sh-icon" data-icon="close" aria-hidden="true"></span></button>
    </div>

    <div class="bubble-details">
      <div class="bubble-field">
        <span class="bubble-field-label">Username:</span>
        <span id="prompt-user" class="bubble-field-value"></span>
      </div>
    </div>

    <div class="bubble-actions">
      <button id="btn-never" class="btn-secondary">Never</button>
      <button id="btn-notnow" class="btn-secondary">Not now</button>
      <button id="btn-save" class="btn-primary">Save</button>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="icons.js"></script>
  <script>
    const api = window.shmmothAPI || window.mtcAPI;
    let currentPromptId = null;

    const elOrigin = document.getElementById('prompt-origin');
    const elUser   = document.getElementById('prompt-user');
    const btnSave  = document.getElementById('btn-save');
    const btnNever = document.getElementById('btn-never');
    const btnNotnow = document.getElementById('btn-notnow');
    const btnClose = document.getElementById('btn-close');

    function populate(data) {
      if (!data) return;
      currentPromptId = data.promptId;
      if (elOrigin) elOrigin.textContent = data.origin || '';
      if (elUser) elUser.textContent = data.username || '';
    }

    function respond(action) {
      if (currentPromptId && api && api.respondPasswordSavePrompt) {
        api.respondPasswordSavePrompt(currentPromptId, action);
      }
      if (api && api.closePasswordBubble) {
        api.closePasswordBubble();
      }
    }

    btnSave.addEventListener('click', () => respond('save'));
    btnNever.addEventListener('click', () => respond('never'));
    btnNotnow.addEventListener('click', () => respond('dismiss'));
    btnClose.addEventListener('click', () => respond('dismiss'));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') respond('dismiss');
      if (e.key === 'Enter') respond('save');
    });

    if (api) {
      if (typeof api.getActivePasswordPrompt === 'function') {
        api.getActivePasswordPrompt().then(populate).catch(() => {});
      }
      if (typeof api.onPasswordOfferSave === 'function') {
        api.onPasswordOfferSave(populate);
      }
    }
  </script>
</body>
</html>
