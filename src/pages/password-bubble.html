<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Password?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      display: flex;
      flex-direction: column;
      padding: 4px;
    }

    .bubble-container {
      width: 100%;
      height: 100%;
      background: #1e293b;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      padding: 14px 16px;
      gap: 12px;
    }

    .bubble-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bubble-icon {
      font-size: 22px;
      line-height: 1;
    }

    .bubble-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .bubble-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    .bubble-origin {
      font-size: 12px;
      color: #38bdf8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bubble-close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
    }

    .bubble-close-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .bubble-details {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bubble-field {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
    }

    .bubble-field-label {
      color: #94a3b8;
    }

    .bubble-field-value {
      color: #f1f5f9;
      font-weight: 500;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bubble-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-secondary:hover {
      background: #475569;
      color: #ffffff;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="bubble-container">
    <div class="bubble-header">
      <span class="bubble-icon">🔑</span>
      <div class="bubble-info">
        <strong class="bubble-title">Save Password?</strong>
        <span id="prompt-origin" class="bubble-origin">example.com</span>
      </div>
      <button id="btn-close" class="bubble-close-btn" title="Dismiss">✕</button>
    </div>

    <div class="bubble-details">
      <div class="bubble-field">
        <span class="bubble-field-label">Username:</span>
        <span id="prompt-user" class="bubble-field-value"></span>
      </div>
    </div>

    <div class="bubble-actions">
      <button id="btn-never" class="btn-secondary">Never</button>
      <button id="btn-notnow" class="btn-secondary">Not now</button>
      <button id="btn-save" class="btn-primary">Save</button>
    </div>
  </div>

  <script>
    const api = window.shmmothAPI || window.mtcAPI;
    let currentPromptId = null;

    const elOrigin = document.getElementById('prompt-origin');
    const elUser   = document.getElementById('prompt-user');
    const btnSave  = document.getElementById('btn-save');
    const btnNever = document.getElementById('btn-never');
    const btnNotnow = document.getElementById('btn-notnow');
    const btnClose = document.getElementById('btn-close');

    function populate(data) {
      if (!data) return;
      currentPromptId = data.promptId;
      if (elOrigin) elOrigin.textContent = data.origin || '';
      if (elUser) elUser.textContent = data.username || '';
    }

    function respond(action) {
      if (currentPromptId && api && api.respondPasswordSavePrompt) {
        api.respondPasswordSavePrompt(currentPromptId, action);
      }
      if (api && api.closePasswordBubble) {
        api.closePasswordBubble();
      }
    }

    btnSave.addEventListener('click', () => respond('save'));
    btnNever.addEventListener('click', () => respond('never'));
    btnNotnow.addEventListener('click', () => respond('dismiss'));
    btnClose.addEventListener('click', () => respond('dismiss'));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') respond('dismiss');
      if (e.key === 'Enter') respond('save');
    });

    if (api) {
      if (typeof api.getActivePasswordPrompt === 'function') {
        api.getActivePasswordPrompt().then(populate).catch(() => {});
      }
      if (typeof api.onPasswordOfferSave === 'function') {
        api.onPasswordOfferSave(populate);
      }
    }
  </script>
</body>
</html>
