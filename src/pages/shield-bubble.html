<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="fonts.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHMMOTH Shield</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: var(--sh-font);
      user-select: none;
      display: flex;
      flex-direction: column;
      padding: 4px;
    }

    .bubble-container {
      animation: sh-pop var(--sh-motion) ease-out;
      width: 100%;
      height: 100%;
      background: var(--sh-surface);
      border: 1px solid var(--sh-success);
      border-radius: 12px;
      box-shadow: var(--sh-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .bubble-header {
      height: 44px;
      background: var(--sh-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid var(--sh-border);
      flex-shrink: 0;
    }

    .bubble-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--sh-text);
    }

    .bubble-title-icon {
      font-size: 15px;
      color: var(--sh-success);
    }

    .btn-close {
      background: transparent;
      border: none;
      color: var(--sh-text-2);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .btn-close:hover {
      color: var(--sh-text);
      background: var(--sh-hover);
    }

    .bubble-body {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .shield-badge-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .shield-count {
      font-size: 32px;
      font-weight: 800;
      color: var(--sh-success);
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .shield-label {
      font-size: 12px;
      color: var(--sh-text-2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .toggle-card {
      width: 100%;
      background: var(--sh-surface-2);
      border: 1px solid var(--sh-border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-text {
      text-align: left;
    }

    .toggle-text strong {
      display: block;
      font-size: 13px;
      color: var(--sh-text);
    }

    .toggle-text span {
      font-size: 11px;
      color: var(--sh-text-2);
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--sh-track);
      transition: .2s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--sh-accent);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .bubble-footer {
      height: 42px;
      background: var(--sh-surface);
      border-top: 1px solid var(--sh-border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      flex-shrink: 0;
    }

    .btn-settings-link {
      width: 100%;
      height: 28px;
      background: transparent;
      border: none;
      color: var(--sh-accent-text);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .btn-settings-link:hover {
      background: var(--sh-hover);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="bubble-container">
    <div class="bubble-header">
      <div class="bubble-title">
        <span class="bubble-title-icon"><span class="sh-icon" data-icon="shield" aria-hidden="true"></span></span>
        <span>SHMMOTH Shield</span>
      </div>
      <button id="btn-close" class="btn-close" title="Close" aria-label="Close"><span class="sh-icon" data-icon="close" aria-hidden="true"></span></button>
    </div>

    <div class="bubble-body">
      <div class="shield-badge-hero">
        <div id="shield-count" class="shield-count">0</div>
        <div class="shield-label">Ads & Trackers Blocked</div>
      </div>

      <div class="toggle-card">
        <div class="toggle-text">
          <strong>Ad & Tracker Blocking</strong>
          <span id="shield-status-sub">Protecting this session</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-shield" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-card" id="site-card" style="margin-top:8px;">
        <div class="toggle-text" style="min-width:0;">
          <strong>On this site</strong>
          <span id="site-status-sub" style="display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px;">—</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-site" checked disabled>
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-card" id="cookie-card" style="margin-top:8px;">
        <div class="toggle-text" style="min-width:0;">
          <strong>Cross-site cookies</strong>
          <span id="cookie-status-sub" style="display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px;">—</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-cookies" checked disabled>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="bubble-footer">
      <button id="btn-settings" class="btn-settings-link">
        <span class="sh-icon" data-icon="settings" aria-hidden="true"></span>
        <span>Privacy & Shield Settings</span>
      </button>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="theme.js"></script>
  <script>
    const api = window.mtcAPI || window.shmmothAPI;
    const shieldCount = document.getElementById('shield-count');
    const toggleShield = document.getElementById('toggle-shield');
    const toggleSite = document.getElementById('toggle-site');
    const siteStatus = document.getElementById('site-status-sub');
    const statusSub = document.getElementById('shield-status-sub');
    const btnSettings = document.getElementById('btn-settings');
    const btnClose = document.getElementById('btn-close');

    async function init() {
      if (!api) return;
      try {
        if (api.getAdsBlockedCount) {
          const count = await api.getAdsBlockedCount();
          shieldCount.textContent = count || 0;
        }
        if (api.getSettings) {
          const s = await api.getSettings();
          const enabled = s.adBlockerEnabled ?? true;
          toggleShield.checked = enabled;
          updateStatusText(enabled);
        }
        await refreshSite();
      } catch (e) {
        console.error('Shield bubble error', e);
      }
    }

    // The "On this site" switch: the site is the one in the active tab (decided in the main process).
    async function refreshSite() {
      if (!api || !api.getAdBlockSite) return;
      try {
        const site = await api.getAdBlockSite();
        if (!site.canPause) {
          toggleSite.disabled = true;
          toggleSite.checked = Boolean(site.enabled);
          siteStatus.textContent = 'Only available on websites';
          siteStatus.style.color = 'var(--sh-text-2)';
          return;
        }
        toggleSite.checked = site.enabled && !site.paused;
        toggleSite.disabled = !site.enabled;                       // the master switch decides when it is off
        siteStatus.textContent = !site.enabled ? site.host + ' — blocker is off everywhere'
          : site.paused ? site.host + ' — paused' : site.host + ' — blocking';
        siteStatus.style.color = !site.enabled || site.paused ? 'var(--sh-danger)' : 'var(--sh-success)';
      } catch (e) {
        console.error('Shield bubble site error', e);
      }
    }

    // "Cross-site cookies": on = blocked on this site (the default), off = the user allowed them here
    const toggleCookies = document.getElementById('toggle-cookies');
    const cookieStatus = document.getElementById('cookie-status-sub');
    async function refreshCookies() {
      if (!api || !api.getPrivacySite) return;
      try {
        const p = await api.getPrivacySite();
        if (!p.canChange) {
          toggleCookies.disabled = true;
          toggleCookies.checked = Boolean(p.enabled);
          cookieStatus.textContent = 'Only available on websites';
          cookieStatus.style.color = 'var(--sh-text-2)';
          return;
        }
        toggleCookies.checked = p.enabled && !p.allowed;
        toggleCookies.disabled = !p.enabled;
        cookieStatus.textContent = !p.enabled ? 'Allowed everywhere (Settings)' : p.allowed ? p.site + ' — allowed' : p.site + ' — blocked';
        cookieStatus.style.color = !p.enabled || p.allowed ? 'var(--sh-danger)' : 'var(--sh-success)';
      } catch (e) {
        console.error('Shield bubble cookie error', e);
      }
    }
    toggleCookies.addEventListener('change', async () => {
      const block = toggleCookies.checked;
      toggleCookies.disabled = true;
      try {
        if (api && api.setPrivacySiteCookies) await api.setPrivacySiteCookies(!block);   // the active tab reloads
      } finally {
        await refreshCookies();
      }
    });
    refreshCookies();

    function updateStatusText(enabled) {
      if (enabled) {
        statusSub.textContent = 'Protecting this session';
        statusSub.style.color = 'var(--sh-success)';
      } else {
        statusSub.textContent = 'Shield is paused';
        statusSub.style.color = 'var(--sh-danger)';
      }
    }

    toggleShield.addEventListener('change', async () => {
      const isEnabled = toggleShield.checked;
      updateStatusText(isEnabled);
      if (api && api.updateSettings) {
        await api.updateSettings({ adBlockerEnabled: isEnabled });
      }
      if (api && api.reloadAdBlockPage) await api.reloadAdBlockPage();   // so the page behind this bubble shows the change
      await refreshSite();
    });

    toggleSite.addEventListener('change', async () => {
      const wantBlocking = toggleSite.checked;
      toggleSite.disabled = true;
      try {
        if (api && api.setAdBlockSite) await api.setAdBlockSite(!wantBlocking);   // the active tab reloads
      } finally {
        await refreshSite();
      }
    });

    btnSettings.addEventListener('click', () => {
      if (api && api.createTab) {
        api.createTab('mtc://settings#privacy');
      }
      if (api && api.closeShieldBubble) {
        api.closeShieldBubble();
      } else {
        window.close();
      }
    });

    btnClose.addEventListener('click', () => {
      if (api && api.closeShieldBubble) {
        api.closeShieldBubble();
      } else {
        window.close();
      }
    });

    if (api && api.onAdsCountUpdate) {
      api.onAdsCountUpdate((count) => {
        shieldCount.textContent = count || 0;
      });
    }

    init();
  </script>
</body>
</html>
