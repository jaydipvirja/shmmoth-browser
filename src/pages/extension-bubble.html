<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="fonts.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extensions</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: var(--sh-font);
      user-select: none;
      display: flex;
      flex-direction: column;
      padding: 4px;
    }

    .bubble-container {
      animation: sh-pop var(--sh-motion) ease-out;
      width: 100%;
      height: 100%;
      background: var(--sh-surface);
      border: 1px solid var(--sh-border-strong);
      border-radius: 12px;
      box-shadow: var(--sh-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .bubble-header {
      height: 44px;
      background: var(--sh-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid var(--sh-border);
      flex-shrink: 0;
    }

    .bubble-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--sh-text);
    }

    .bubble-title-icon {
      font-size: 15px;
    }

    .btn-close {
      background: transparent;
      border: none;
      color: var(--sh-text-2);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .btn-close:hover {
      color: var(--sh-text);
      background: var(--sh-hover);
    }

    /* List Area */
    .bubble-body {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
      display: flex;
      flex-direction: column;
    }

    .bubble-body::-webkit-scrollbar {
      width: 6px;
    }

    .bubble-body::-webkit-scrollbar-thumb {
      background: var(--sh-hover);
      border-radius: 3px;
    }

    .ext-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      gap: 10px;
      transition: background 0.15s ease;
      cursor: default;
    }

    .ext-item:hover {
      background: var(--sh-hover);
    }

    .ext-item-main {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .ext-item-icon {
      font-size: 16px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .ext-item-icon img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .ext-item-name {
      font-size: 13px;
      color: var(--sh-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .ext-item-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-pin {
      background: transparent;
      border: none;
      font-size: 13px;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 4px;
      color: var(--sh-text-2);
      transition: all 0.15s ease;
    }

    .btn-pin:hover {
      background: var(--sh-hover);
      color: var(--sh-text);
    }

    .btn-pin.pinned {
      color: var(--sh-accent-text);
    }

    .btn-pin.pinned svg {
      fill: currentColor;
    }

    .empty-state {
      padding: 28px 16px;
      text-align: center;
      color: var(--sh-text-2);
      font-size: 13px;
      line-height: 1.5;
    }

    /* Footer */
    .bubble-footer {
      height: 44px;
      background: var(--sh-surface);
      border-top: 1px solid var(--sh-border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      flex-shrink: 0;
    }

    .btn-manage-ext {
      width: 100%;
      height: 32px;
      background: var(--sh-hover);
      border: 1px solid var(--sh-border);
      border-radius: 6px;
      color: var(--sh-text);
      font-size: 12.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-manage-ext:hover {
      background: var(--sh-hover);
      color: var(--sh-text);
      border-color: var(--sh-border-strong);
    }
  </style>
</head>
<body>
  <div class="bubble-container">
    <div class="bubble-header">
      <div class="bubble-title">
        <span class="bubble-title-icon"><span class="sh-icon" data-icon="puzzle" aria-hidden="true"></span></span>
        <span>Extensions</span>
      </div>
      <button id="btn-close" class="btn-close" title="Close" aria-label="Close"><span class="sh-icon" data-icon="close" aria-hidden="true"></span></button>
    </div>

    <div id="ext-list" class="bubble-body">
      <!-- Dynamic list -->
    </div>

    <div class="bubble-footer">
      <button id="btn-manage" class="btn-manage-ext">
        <span class="sh-icon" data-icon="puzzle" aria-hidden="true"></span>
        <span>Manage extensions</span>
      </button>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="theme.js"></script>
  <script>
    const api = window.mtcAPI || window.shmmothAPI;
    const extListContainer = document.getElementById('ext-list');
    const btnManage = document.getElementById('btn-manage');
    const btnClose = document.getElementById('btn-close');

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadExtensions() {
      if (!api || !api.getAllExtensions) return;
      try {
        const res = await api.getAllExtensions();
        const list = Array.isArray(res && res.extensions) ? res.extensions : (Array.isArray(res) ? res : []);
        render(list);
      } catch (e) {
        console.error('Error loading extensions', e);
      }
    }

    function render(list) {
      if (!list || list.length === 0) {
        extListContainer.innerHTML = '<div class="empty-state">No extensions installed yet.<br><small>Click below to install or manage extensions.</small></div>';
        return;
      }

      extListContainer.innerHTML = '';
      list.forEach(ext => {
        const item = document.createElement('div');
        item.className = 'ext-item';

        let iconHtml = '<span class="sh-icon" data-icon="puzzle" aria-hidden="true"></span>';
        if (ext.icons && (ext.icons['32'] || ext.icons['16'] || ext.icons['48'])) {
          const rel = ext.icons['32'] || ext.icons['16'] || ext.icons['48'];
          const iconPath = `file:///${ext.path.replace(/\\/g, '/')}/${rel.replace(/^[\\\/]+/, '')}`;
          iconHtml = `<img src="${escapeHtml(iconPath)}" alt="" onerror="this.replaceWith(window.ShIcons.create('puzzle'))"/>`;
        }

        item.innerHTML = `
          <div class="ext-item-main" title="${escapeHtml(ext.name)}">
            <div class="ext-item-icon">${iconHtml}</div>
            <span class="ext-item-name">${escapeHtml(ext.name)}</span>
          </div>
          <div class="ext-item-actions">
            <button class="btn-pin ${ext.pinned ? 'pinned' : ''}" aria-label="${ext.pinned ? 'Unpin from toolbar' : 'Pin to toolbar'}" title="${ext.pinned ? 'Unpin from toolbar' : 'Pin to toolbar'}">
              <span class="sh-icon" data-icon="pin" aria-hidden="true"></span>
            </button>
          </div>
        `;

        item.querySelector('.ext-item-main').addEventListener('click', async () => {
          if (api && api.triggerExtensionAction) {
            await api.triggerExtensionAction(ext.id);
            if (api.closeExtensionBubble) api.closeExtensionBubble();
          }
        });

        const pinBtn = item.querySelector('.btn-pin');
        pinBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (api && api.togglePinExtension) {
            const nextPinned = !ext.pinned;
            ext.pinned = nextPinned;
            await api.togglePinExtension(ext.id, nextPinned);
            pinBtn.classList.toggle('pinned', nextPinned);
            pinBtn.title = nextPinned ? 'Unpin from toolbar' : 'Pin to toolbar';
          }
        });

        extListContainer.appendChild(item);
      });
      if (window.ShIcons) window.ShIcons.drawAll(extListContainer);
    }

    btnManage.addEventListener('click', () => {
      if (api && api.createTab) {
        api.createTab('mtc://extensions');
      }
      if (api && api.closeExtensionBubble) {
        api.closeExtensionBubble();
      } else {
        window.close();
      }
    });

    btnClose.addEventListener('click', () => {
      if (api && api.closeExtensionBubble) {
        api.closeExtensionBubble();
      } else {
        window.close();
      }
    });

    if (api && api.onExtensionsUpdated) {
      api.onExtensionsUpdated((list) => {
        render(Array.isArray(list) ? list : []);
      });
    }

    loadExtensions();
  </script>
</body>
</html>
