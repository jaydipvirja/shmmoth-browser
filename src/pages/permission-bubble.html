<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="fonts.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Permission Request</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: var(--sh-font);
      user-select: none;
      display: flex;
      flex-direction: column;
      padding: 4px;
    }

    .bubble-container {
      animation: sh-pop var(--sh-motion) ease-out;
      width: 100%;
      height: 100%;
      background: var(--sh-surface);
      border: 1px solid var(--sh-border);
      border-radius: 12px;
      box-shadow: var(--sh-shadow);
      display: flex;
      flex-direction: column;
      padding: 14px 16px;
      gap: 10px;
    }

    .bubble-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .bubble-icon {
      font-size: 20px;
      line-height: 1;
      padding-top: 2px;
    }

    .bubble-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }

    .bubble-origin {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--sh-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bubble-desc {
      font-size: 12px;
      color: var(--sh-text-2);
      line-height: 1.3;
    }

    .bubble-close-btn {
      background: transparent;
      border: none;
      color: var(--sh-text-2);
      font-size: 15px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
    }

    .bubble-close-btn:hover {
      color: var(--sh-text);
      background: var(--sh-hover);
    }

    .bubble-options {
      font-size: 12px;
      color: var(--sh-text-2);
      padding-left: 2px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .remember-label input {
      accent-color: var(--sh-accent);
      cursor: pointer;
    }

    .bubble-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: auto;
    }

    .btn-block {
      background: var(--sh-surface-2);
      color: var(--sh-text);
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-block:hover {
      background: var(--sh-border-strong);
    }

    .btn-allow {
      background: var(--sh-accent);
      color: var(--sh-on-accent);
      border: none;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-allow:hover {
      background: var(--sh-accent);
    }
  </style>
</head>
<body>
  <div class="bubble-container">
    <div class="bubble-header">
      <span id="perm-icon" class="bubble-icon"><span class="sh-icon" data-icon="lock" aria-hidden="true"></span></span>
      <div class="bubble-info">
        <strong id="perm-origin" class="bubble-origin">Website</strong>
        <span id="perm-desc" class="bubble-desc">wants permission</span>
      </div>
      <button id="btn-close" class="bubble-close-btn" title="Dismiss" aria-label="Dismiss"><span class="sh-icon" data-icon="close" aria-hidden="true"></span></button>
    </div>

    <div class="bubble-options">
      <label class="remember-label">
        <input type="checkbox" id="cb-remember" checked>
        <span>Always remember for this site</span>
      </label>
    </div>

    <div class="bubble-actions">
      <button id="btn-block" class="btn-block">Block</button>
      <button id="btn-allow" class="btn-allow">Allow</button>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="theme.js"></script>
  <script>
    const api = window.mtcAPI || window.shmmothAPI;
    let currentRequestId = null;

    const permIcon   = document.getElementById('perm-icon');
    const permOrigin = document.getElementById('perm-origin');
    const permDesc   = document.getElementById('perm-desc');
    const cbRemember = document.getElementById('cb-remember');
    const btnBlock   = document.getElementById('btn-block');
    const btnAllow   = document.getElementById('btn-allow');
    const btnClose   = document.getElementById('btn-close');

    function respond(decision) {
      if (currentRequestId && api && api.respondPermissionRequest) {
        api.respondPermissionRequest(currentRequestId, decision, cbRemember.checked);
      }
      currentRequestId = null;
      if (api && api.closePermissionBubble) {
        api.closePermissionBubble();
      } else {
        window.close();
      }
    }

    btnAllow.addEventListener('click', () => respond('allow'));
    btnBlock.addEventListener('click', () => respond('block'));
    btnClose.addEventListener('click', () => respond('block'));

    if (api && api.onPermissionRequest) {
      api.onPermissionRequest((data) => {
        if (!data) return;
        currentRequestId = data.requestId;
        permOrigin.textContent = data.origin || 'Website';

        let desc = `wants to use ${data.permission}`;
        let icon = 'lock';
        if (data.permission === 'media') {
          icon = 'camera';
          desc = 'wants to use your camera and microphone';
        } else if (data.permission === 'geolocation') {
          icon = 'map-pin';
          desc = 'wants to know your location';
        } else if (data.permission === 'notifications') {
          icon = 'bell';
          desc = 'wants to show notifications';
        } else if (data.permission === 'pointerLock') {
          icon = 'pointer';
          desc = 'wants to lock your mouse pointer';
        }

        const svg = window.ShIcons ? window.ShIcons.create(icon) : null;
        if (svg) permIcon.replaceChildren(svg);
        permDesc.textContent = desc;
      });
    }
  </script>
</body>
</html>
